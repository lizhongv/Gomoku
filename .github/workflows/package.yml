name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 安装 WiX
        shell: pwsh
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append $env:GITHUB_PATH
          }
      - name: 构建 MSI
        shell: bash
        run: bash scripts/package-desktop.sh msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/package/*.msi
          if-no-files-found: error

  linux:
    name: Linux DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 安装打包工具
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: 构建 DEB
        run: bash scripts/package-desktop.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/package/*.deb
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 生成 icns
        run: |
          mkdir -p packaging/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png --out packaging/icon.iconset/icon_${size}x${size}.png
            sips -z $((size * 2)) $((size * 2)) packaging/icon.png --out packaging/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns packaging/icon.iconset -o packaging/icon.icns
      - name: 构建 DMG
        run: bash scripts/package-desktop.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/package/*.dmg
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
